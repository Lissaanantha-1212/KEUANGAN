<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCore OS - Enterprise Finance Platform</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://ztgjmyjrtrlyrgntvtny.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GGh8txjx_3OFYwmTGdccjQ_zkxRYqep";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    function MultiRoleFinCoreApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [userRole, setUserRole] = useState('');
      const [userName, setUserName] = useState('');
      
      const [inputName, setInputName] = useState('');
      const [inputRole, setInputRole] = useState('Finance Admin');

      // Sidebar & Tab Navigation
      const [currentMenu, setCurrentMenu] = useState('input');
      const [adminSubTab, setAdminSubTab] = useState('entry');
      const [transactions, setTransactions] = useState([]);

      // Filter & Search
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCostCenter, setFilterCostCenter] = useState('ALL');

      // State Form Transaksi
      const [transType, setTransType] = useState('EXPENSE');
      const [vendorName, setVendorName] = useState('');
      const [amount, setAmount] = useState('');
      const [costCenter, setCostCenter] = useState('Operational');
      const [paymentMethod, setPaymentMethod] = useState('Bank Transfer');
      const [taxCategory, setTaxCategory] = useState('PPN 11%');
      const [transDate, setTransDate] = useState(new Date().toISOString().split('T')[0]);
      const [notes, setNotes] = useState('');
      const [fileName, setFileName] = useState('');

      // State Tambahan Kas Kecil & Vendor
      const [pettyClaimAmount, setPettyClaimAmount] = useState('');
      const [pettyDesc, setPettyDesc] = useState('');
      const [newVendorName, setNewVendorName] = useState('');
      const [newVendorCategory, setNewVendorCategory] = useState('Supplier Material');

      useEffect(() => {
        if (window.lucide) {
          lucide.createIcons();
        }
      }, [currentUser, currentMenu, adminSubTab, userRole, transactions]);

      const handleQuickRegister = (e) => {
        e.preventDefault();
        if (!inputName.trim()) return alert("Mohon isi Nama Lengkap!");

        setCurrentUser({ name: inputName });
        setUserName(inputName);
        setUserRole(inputRole);
        setMenuByRole(inputRole);
        loadTransactions();
      };

      const setMenuByRole = (role) => {
        if (role === 'Finance Admin') setCurrentMenu('input');
        else if (role === 'Internal Auditor') setCurrentMenu('audit');
        else if (role === 'Finance Controller') setCurrentMenu('tax');
        else setCurrentMenu('dashboard');
      };

      const loadTransactions = async () => {
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
          if (data) {
            setTransactions(data);
          }
        } catch (err) {
          console.log("Supabase error:", err);
        }
        if (window.lucide) setTimeout(() => lucide.createIcons(), 100);
      };

      const handleAddTransaction = async (e) => {
        e.preventDefault();
        const numAmount = parseFloat(amount);
        if (isNaN(numAmount) || numAmount <= 0) return alert("Nominal transaksi harus berupa angka positif!");

        let calculatedRisk = 10;
        if (numAmount > 100000000) calculatedRisk = 85;
        else if (numAmount > 50000000) calculatedRisk = 50;
        else if (numAmount > 20000000) calculatedRisk = 30;

        const generatedCode = 'TRX-' + Math.floor(Date.now() / 1000);

        const newRecord = {
          transaction_code: generatedCode,
          type: transType,
          vendor_name: vendorName,
          amount: numAmount,
          cost_center: costCenter,
          payment_method: paymentMethod,
          tax_category: taxCategory,
          trans_date: transDate,
          notes: notes,
          receipt_file: fileName || 'nota_default.pdf',
          risk_score: calculatedRisk,
          status: calculatedRisk > 40 ? 'PENDING_AUDIT' : 'APPROVED'
        };

        try {
          const { error } = await supabaseClient.from('transactions').insert([newRecord]);
          if (!error) {
            alert('Berhasil! Transaksi telah disimpan ke Supabase.');
            setVendorName('');
            setAmount('');
            setNotes('');
            setFileName('');
            loadTransactions();
          } else {
            alert('Error Simpan: ' + error.message);
          }
        } catch (err) {
          alert('Terjadi kesalahan koneksi.');
        }
      };

      const handleAddPettyClaim = async (e) => {
        e.preventDefault();
        if (!pettyClaimAmount || parseFloat(pettyClaimAmount) <= 0) return alert("Isi nominal kas kecil!");
        
        const newRecord = {
          transaction_code: 'PC-' + Math.floor(Date.now() / 1000),
          type: 'EXPENSE',
          vendor_name: 'KAS KECIL - ' + pettyDesc,
          amount: parseFloat(pettyClaimAmount),
          cost_center: 'Operational',
          payment_method: 'Petty Cash',
          tax_category: 'Non-Pajak',
          trans_date: new Date().toISOString().split('T')[0],
          notes: pettyDesc,
          receipt_file: 'petty_cash_voucher.pdf',
          risk_score: 5,
          status: 'APPROVED'
        };

        await supabaseClient.from('transactions').insert([newRecord]);
        setPettyClaimAmount('');
        setPettyDesc('');
        alert("Klaim Kas Kecil Berhasil Ditambahkan!");
        loadTransactions();
      };

      const handleUpdateStatus = async (id, newStatus) => {
        await supabaseClient.from('transactions').update({ status: newStatus }).eq('id', id);
        alert(`Status transaksi berhasil diperbarui menjadi: ${newStatus}`);
        loadTransactions();
      };

      const handleDeleteTransaction = async (id) => {
        if (confirm('Yakin ingin menghapus transaksi ini?')) {
          await supabaseClient.from('transactions').delete().eq('id', id);
          loadTransactions();
        }
      };

      const handleExportCSV = () => {
        if (transactions.length === 0) return alert("Tidak ada data transaksi!");
        const headers = ["Kode TRX", "Tanggal", "Vendor", "Tipe", "Nominal", "Cost Center", "Metode", "Pajak", "Status"];
        const rows = transactions.map(t => [
          t.transaction_code || `TRX-${t.id}`,
          t.trans_date || '',
          `"${t.vendor_name || ''}"`,
          t.type || 'EXPENSE',
          t.amount || 0,
          `"${t.cost_center || ''}"`,
          `"${t.payment_method || ''}"`,
          `"${t.tax_category || ''}"`,
          t.status || 'APPROVED'
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Laporan_FinCore_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredTransactions = transactions.filter(t => {
        const matchesSearch = (t.vendor_name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (t.transaction_code || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (t.notes || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCostCenter = filterCostCenter === 'ALL' || t.cost_center === filterCostCenter;
        return matchesSearch && matchesCostCenter;
      });

      const vendorStats = transactions.reduce((acc, curr) => {
        const v = curr.vendor_name || 'Uncategorized';
        if (!acc[v]) acc[v] = { count: 0, total: 0, lastDate: curr.trans_date };
        acc[v].count += 1;
        acc[v].total += (curr.amount || 0);
        return acc;
      }, {});

      const pettyCashTransactions = transactions.filter(t => t.payment_method === 'Petty Cash');
      const pettyCashTotal = pettyCashTransactions.reduce((acc, curr) => acc + (curr.amount || 0), 0);
      const totalAmount = transactions.reduce((acc, curr) => acc + (curr.amount || 0), 0);
      const pendingCount = transactions.filter(t => t.status === 'PENDING_AUDIT').length;

      // HALAMAN LOGIN
      if (!currentUser) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-950 p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
              <div className="text-center mb-6">
                <div className="h-12 w-12 mx-auto rounded-2xl bg-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-600/30 mb-3">
                  F
                </div>
                <h1 className="text-xl font-bold text-white">FinCore OS Portal</h1>
                <p className="text-xs text-slate-400 mt-1">Pilih Jabatan untuk Masuk ke Sistem Enterprise</p>
              </div>

              <form onSubmit={handleQuickRegister} className="space-y-4 text-xs">
                <div>
                  <label className="block text-slate-400 mb-1 font-semibold">Nama Lengkap</label>
                  <input type="text" required value={inputName} onChange={(e) => setInputName(e.target.value)} placeholder="Masukkan nama Anda..." className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" />
                </div>

                <div>
                  <label className="block text-slate-400 mb-1 font-semibold">Posisi / Jabatan Hub</label>
                  <select value={inputRole} onChange={(e) => setInputRole(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-indigo-400 font-bold focus:outline-none focus:border-indigo-500">
                    <option value="Finance Admin">Finance Admin (Operator Entry & Kas Kecil)</option>
                    <option value="Internal Auditor">Internal Auditor (Pengawas Fraud & Risk Score)</option>
                    <option value="Finance Controller">Finance Controller (Kalkulator Pajak & Depresiasi Aset)</option>
                    <option value="CFO / Direksi">CFO / Direksi (Executive Control Tower & Approval)</option>
                  </select>
                </div>

                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/25 transition-all">
                  Masuk ke Portal System
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-slate-950">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div className="overflow-y-auto">
              <div className="p-5 border-b border-slate-800 flex items-center gap-3">
                <div className="h-9 w-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white">F</div>
                <div>
                  <h1 className="font-bold text-sm text-white">FinCore OS</h1>
                  <span className="text-[10px] bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded font-bold">{userRole}</span>
                </div>
              </div>

              <div className="p-3 space-y-4">
                {/* OPERATIONAL HUB */}
                <div>
                  <div className="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Operasional Daily</div>
                  <nav className="space-y-1 text-xs font-medium">
                    <button onClick={() => setCurrentMenu('input')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'input' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="receipt" className="w-4 h-4"></i> Operations Hub
                    </button>
                    <button onClick={() => setCurrentMenu('ap')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'ap' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="arrow-up-right" className="w-4 h-4"></i> AP / Hutang Usaha
                    </button>
                    <button onClick={() => setCurrentMenu('ar')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'ar' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="arrow-down-left" className="w-4 h-4"></i> AR / Piutang Klien
                    </button>
                    <button onClick={() => setCurrentMenu('bank_recon')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'bank_recon' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="landmark" className="w-4 h-4"></i> Rekonsiliasi Bank
                    </button>
                  </nav>
                </div>

                {/* MANAGEMENT & CONTROL */}
                <div>
                  <div className="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Kontrol & Audit</div>
                  <nav className="space-y-1 text-xs font-medium">
                    <button onClick={() => setCurrentMenu('budgeting')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'budgeting' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="pie-chart" className="w-4 h-4"></i> Budget & Cash Flow
                    </button>
                    <button onClick={() => setCurrentMenu('audit')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'audit' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="shield-alert" className="w-4 h-4"></i> Auditor Guard Center
                    </button>
                    <button onClick={() => setCurrentMenu('tax')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'tax' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="percent" className="w-4 h-4"></i> Perpajakan & Aset
                    </button>
                  </nav>
                </div>

                {/* EXECUTIVE */}
                <div>
                  <div className="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Laporan Eksekutif</div>
                  <nav className="space-y-1 text-xs font-medium">
                    <button onClick={() => setCurrentMenu('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Executive Control
                    </button>
                    <button onClick={() => setCurrentMenu('vault')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg ${currentMenu === 'vault' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="folder-archive" className="w-4 h-4"></i> Vault Dokumen Nota
                    </button>
                  </nav>
                </div>
              </div>
            </div>

            <div className="p-3 border-t border-slate-800 space-y-2 shrink-0">
              <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                <div className="text-[10px] text-slate-500">Pengguna Aktif:</div>
                <div className="text-xs font-bold text-white truncate">{userName}</div>
              </div>
              <button onClick={() => setCurrentUser(null)} className="w-full text-center text-xs text-red-400 py-1.5 hover:underline font-semibold">
                Keluar (Logout)
              </button>
            </div>
          </aside>

          {/* WORKSPACE AREA */}
          <main className="flex-1 overflow-y-auto p-8">
            
            {/* 1. OPERATIONS HUB (ADMIN) */}
            {currentMenu === 'input' && (
              <div className="space-y-6 max-w-6xl mx-auto">
                <div className="border-b border-slate-800 pb-5">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div>
                      <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                        <i data-lucide="briefcase" className="text-indigo-500 w-6 h-6"></i>
                        Finance Admin Operations Hub
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">Pusat pencatatan nota, manajemen vendor, pengelolaan kas kecil, & laporan transaksi.</p>
                    </div>

                    <div className="flex items-center gap-2">
                      <button onClick={loadTransactions} className="bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-xl flex items-center gap-2 font-medium">
                        <i data-lucide="refresh-cw" className="w-3.5 h-3.5"></i> Refresh Data
                      </button>
                      <button onClick={handleExportCSV} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-xl flex items-center gap-2 font-semibold shadow-lg shadow-emerald-600/20">
                        <i data-lucide="download" className="w-3.5 h-3.5"></i> Export CSV
                      </button>
                    </div>
                  </div>

                  {/* SUB TAB BUTTONS */}
                  <div className="flex border-b border-slate-800 gap-2 text-xs font-semibold">
                    <button onClick={() => setAdminSubTab('entry')} className={`pb-2.5 px-3 border-b-2 flex items-center gap-2 ${adminSubTab === 'entry' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                      <i data-lucide="edit-3" className="w-3.5 h-3.5"></i> Smart Entry & Live Audit
                    </button>
                    <button onClick={() => setAdminSubTab('vendors')} className={`pb-2.5 px-3 border-b-2 flex items-center gap-2 ${adminSubTab === 'vendors' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                      <i data-lucide="users" className="w-3.5 h-3.5"></i> Direktori Vendor ({Object.keys(vendorStats).length})
                    </button>
                    <button onClick={() => setAdminSubTab('petty')} className={`pb-2.5 px-3 border-b-2 flex items-center gap-2 ${adminSubTab === 'petty' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                      <i data-lucide="wallet" className="w-3.5 h-3.5"></i> Kas Kecil (Petty Cash)
                    </button>
                  </div>
                </div>

                {/* METRICS SUMMARY */}
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                    <div>
                      <div className="text-xs text-slate-400 font-medium">Total Transaksi</div>
                      <div className="text-xl font-bold text-white mt-1">{transactions.length} Item</div>
                    </div>
                    <div className="h-9 w-9 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center font-bold">
                      <i data-lucide="file-text" className="w-4 h-4"></i>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                    <div>
                      <div className="text-xs text-slate-400 font-medium">Pending Auditor</div>
                      <div className="text-xl font-bold text-amber-400 mt-1">{pendingCount} Item</div>
                    </div>
                    <div className="h-9 w-9 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center font-bold">
                      <i data-lucide="clock" className="w-4 h-4"></i>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                    <div>
                      <div className="text-xs text-slate-400 font-medium font-semibold">Pengeluaran Kas Kecil</div>
                      <div className="text-xl font-bold text-sky-400 mt-1">Rp {pettyCashTotal.toLocaleString('id-ID')}</div>
                    </div>
                    <div className="h-9 w-9 bg-sky-500/10 text-sky-400 rounded-xl flex items-center justify-center font-bold">
                      <i data-lucide="coins" className="w-4 h-4"></i>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                    <div>
                      <div className="text-xs text-slate-400 font-medium font-semibold">Total Volume Terinput</div>
                      <div className="text-xl font-bold text-emerald-400 mt-1">Rp {totalAmount.toLocaleString('id-ID')}</div>
                    </div>
                    <div className="h-9 w-9 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center font-bold">
                      <i data-lucide="credit-card" className="w-4 h-4"></i>
                    </div>
                  </div>
                </div>

                {/* SUB TAB 1: SMART ENTRY */}
                {adminSubTab === 'entry' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      <form onSubmit={handleAddTransaction} className="lg:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4 text-xs">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                          <h3 className="font-bold text-sm text-white flex items-center gap-2">
                            <i data-lucide="plus-circle" className="text-indigo-400 w-4 h-4"></i> Form Catat Transaksi Baru
                          </h3>
                          <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded">Auto Audit Active</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Tipe Transaksi</label>
                            <select value={transType} onChange={(e) => setTransType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white font-medium">
                              <option value="EXPENSE">Pengeluaran (Expense / Payout)</option>
                              <option value="INCOME">Pemasukan (Income / Revenue)</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Tanggal Transaksi</label>
                            <input type="date" value={transDate} onChange={(e) => setTransDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Nama Vendor / Klien</label>
                            <input type="text" required value={vendorName} onChange={(e) => setVendorName(e.target.value)} placeholder="Contoh: PT Vendor Utama" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white" />
                          </div>
                          <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Nominal Transaksi (Rp)</label>
                            <input type="number" required value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="Contoh: 15000000" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white font-mono" />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          <div>

                  </div>
                  <div className="bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-lg text-red-400 font-bold">
                    Pending Verification: {pendingCount} TRX
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="font-bold text-white mb-4 text-sm">Review Transaksi Berisiko (High Risk Score Threshold &gt; 40%)</h3>
                  {transactions.length === 0 ? (
                    <p className="text-slate-500 py-4">Belum ada data transaksi.</p>
                  ) : (
                    <table className="w-full text-left">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="p-3">Kode TRX</th>
                          <th className="p-3">Vendor</th>
                          <th className="p-3">Nominal</th>
                          <th className="p-3">Risk Score</th>
                          <th className="p-3">Status</th>
                          <th className="p-3 text-right">Keputusan Auditor</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-200">
                        {transactions.map(t => (
                          <tr key={t.id} className="hover:bg-slate-800/40">
                            <td className="p-3 font-mono text-slate-400">{t.transaction_code || `TRX-${t.id}`}</td>
                            <td className="p-3 font-semibold">{t.vendor_name}</td>
                            <td className="p-3 font-mono font-bold text-white">Rp {(t.amount || 0).toLocaleString('id-ID')}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.risk_score > 40 ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                                {t.risk_score || 10}%
                              </span>
                            </td>
                            <td className="p-3">
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">{t.status || 'APPROVED'}</span>
                            </td>
                            <td className="p-3 text-right space-x-2">
                              <button onClick={() => handleUpdateStatus(t.id, 'APPROVED')} className="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-[11px] font-semibold">Approve</button>
                              <button onClick={() => handleUpdateStatus(t.id, 'FLAGGED_FRAUD')} className="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1 rounded text-[11px] font-semibold">Tolak / Flag Fraud</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* 8. CONTROLLER WORKSPACE */}
            {currentMenu === 'tax' && (
              <div className="space-y-6 text-xs max-w-6xl mx-auto">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="percent" className="text-indigo-400 w-5 h-5"></i> Tax & Asset Depreciation Controller
                  </h2>
                  <p className="text-slate-400 mt-1">Kalkulasi real-time beban pajak dan jadwal penyusutan aset perusahaan.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <span className="text-slate-400 font-semibold">Estimasi PPN Terhutang (11% Outflow)</span>
                    <div className="text-2xl font-bold text-indigo-400 mt-2 font-mono">
                      Rp {(totalAmount * 0.11).toLocaleString('id-ID')}
                    </div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <span className="text-slate-400 font-semibold">Estimasi PPh 23 (Jasa Operasional 2%)</span>
                    <div className="text-2xl font-bold text-sky-400 mt-2 font-mono">
                      Rp {(totalAmount * 0.02).toLocaleString('id-ID')}
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h3 className="font-bold text-white text-sm">Simulasi Jadwal Depresiasi Aset Perusahaan</h3>
                  <table className="w-full text-left">
                    <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                      <tr>
                        <th className="p-3">Nama Aset</th>
                        <th className="p-3">Tahun Pembelian</th>
                        <th className="p-3">Harga Perolehan</th>
                        <th className="p-3">Masa Manfaat</th>
                        <th className="p-3">Penyusutan / Tahun</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-slate-200">
                      <tr>
                        <td className="p-3 font-bold">Server & Network Infrastructure</td>
                        <td className="p-3">2025</td>
                        <td className="p-3 font-mono">Rp 120.000.000</td>
                        <td className="p-3">4 Tahun</td>
                        <td className="p-3 font-mono text-indigo-400 font-bold">Rp 30.000.000</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-bold">Laptop Developer & Workstation</td>
                        <td className="p-3">2026</td>
                        <td className="p-3 font-mono">Rp 80.000.000</td>
                        <td className="p-3">4 Tahun</td>
                        <td className="p-3 font-mono text-indigo-400 font-bold">Rp 20.000.000</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 9. CFO WORKSPACE */}
            {currentMenu === 'dashboard' && (
              <div className="space-y-6 text-xs max-w-6xl mx-auto">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="layout-dashboard" className="text-emerald-400 w-5 h-5"></i> Executive Control Tower (CFO Dashboard)
                  </h2>
                  <p className="text-slate-400 mt-1">Ringkasan kesehatan finansial tingkat tinggi untuk Direksi.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                    <span className="text-slate-400">Total Liquid Cash (Kas Bank)</span>
                    <div className="text-2xl font-bold text-emerald-400 mt-2 font-mono">Rp 1.480.000.000</div>
                  </div>
                  <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                    <span className="text-slate-400">Monthly Burn Rate</span>
                    <div className="text-2xl font-bold text-amber-400 mt-2 font-mono">Rp {(totalAmount).toLocaleString('id-ID')}</div>
                  </div>
                  <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                    <span className="text-slate-400">Status Kewaspadaan</span>
                    <div className="text-2xl font-bold text-indigo-400 mt-2">STABIL / HEALTHY</div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h3 className="font-bold text-white text-sm">Approval Center Transaksi Bernominal Besar (&gt; Rp 50 Juta)</h3>
                  <div className="space-y-2">
                    {transactions.filter(t => (t.amount || 0) > 50000000).map(t => (
                      <div key={t.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                        <div>
                          <div className="font-bold text-white">{t.vendor_name} ({t.transaction_code})</div>
                          <div className="text-slate-400">Nominal: <strong className="text-emerald-400 font-mono">Rp {t.amount.toLocaleString('id-ID')}</strong></div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => handleUpdateStatus(t.id, 'CFO_APPROVED')} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded font-bold text-[11px]">Setujui Disbursement</button>
                        </div>
                      </div>
                    ))}
                    {transactions.filter(t => (t.amount || 0) > 50000000).length === 0 && (
                      <p className="text-slate-500">Tidak ada pengajuan pengeluaran besar yang memerlukan persetujuan CFO saat ini.</p>
                    )}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MultiRoleFinCoreApp />);
  </script>
</body>
</html>
