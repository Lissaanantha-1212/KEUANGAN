<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCore OS - Sistem Keuangan Enterprise</title>
  
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Ganti dengan URL & Anon Key Supabase milikmu sendiri nanti
    const SUPABASE_URL = "https://your-project.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function FinancialApp() {
      const [activeTab, setActiveTab] = useState('input');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [vendor, setVendor] = useState('');
      const [ocrScanning, setOcrScanning] = useState(false);
      const [riskScore, setRiskScore] = useState(0);
      const [riskFlags, setRiskFlags] = useState([]);
      const [approvalStatus, setApprovalStatus] = useState('Auto-Approve');

      const [delayDays, setDelayDays] = useState(14);
      const [projectedBalance, setProjectedBalance] = useState(450000000);

      useEffect(() => {
        lucide.createIcons();
      }, [activeTab, ocrScanning, riskFlags]);

      useEffect(() => {
        let score = 0;
        let flags = [];
        const numAmount = parseFloat(amount) || 0;

        if (numAmount > 50000000) {
          score += 40;
          flags.push('Transaksi > Rp50.000.000 butuh 2-Step Approval (CFO)');
          setApprovalStatus('Membutuhkan Approval CFO');
        } else if (numAmount > 10000000) {
          score += 15;
          setApprovalStatus('Membutuhkan Approval Manager');
        } else {
          setApprovalStatus('Auto-Approve (< Rp10 Juta)');
        }

        if (description.toLowerCase().includes('cash') || description.toLowerCase().includes('reimburse darurat')) {
          score += 30;
          flags.push('Penggunaan kas tunai/reimburse darurat memicu audit kaji ulang');
        }

        if (vendor && vendor.toLowerCase().includes('baru')) {
          score += 25;
          flags.push('Vendor belum terverifikasi dalam database COA');
        }

        setRiskScore(score);
        setRiskFlags(flags);
      }, [amount, description, vendor]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setOcrScanning(true);
        setTimeout(() => {
          setAmount('18500000');
          setDescription('Pembelian Server & Hardware Maintenance PT Utama');
          setVendor('PT Hardware Utama Jaya');
          setOcrScanning(false);
        }, 1500);
      };

      const handleSubmitTransaction = async (e) => {
        e.preventDefault();
        try {
          const { data, error } = await supabaseClient
            .from('transactions')
            .insert([{
              transaction_code: `TX-${Date.now()}`,
              type: 'expense',
              amount: parseFloat(amount),
              description: description,
              transaction_date: new Date().toISOString(),
              status: riskScore > 50 ? 'pending_approval' : 'approved'
            }]);

          alert('Simulasi simpan berhasil! (Ganti URL & Key Supabase agar tersimpan ke database aktual)');
          setAmount('');
          setDescription('');
          setVendor('');
        } catch (err) {
          console.error(err);
          alert('Terjadi kesalahan koneksi database.');
        }
      };

      return (
        <div className="min-h-screen p-6">
          <header className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-2">
                <div className="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                  F
                </div>
                <h1 className="text-xl font-bold tracking-tight text-white">FinCore OS <span className="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full ml-2">Enterprise</span></h1>
              </div>
              <p className="text-sm text-slate-400 mt-1">Sistem Keuangan UMKM - Big Enterprise</p>
            </div>

            <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
              <button 
                onClick={() => setActiveTab('input')}
                className={`px-4 py-2 text-sm font-medium rounded-lg transition-all ${activeTab === 'input' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
              >
                Smart Entry & Fraud Check
              </button>
              <button 
                onClick={() => setActiveTab('simulator')}
                className={`px-4 py-2 text-sm font-medium rounded-lg transition-all ${activeTab === 'simulator' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
              >
                Predictive Cashflow
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto mt-8">
            {activeTab === 'input' ? (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                      <i data-lucide="zap" className="w-5 h-5 text-indigo-400"></i> Input Transaksi Pengeluaran
                    </h2>
                    <span className="text-xs text-slate-400">OCR Scan Active</span>
                  </div>

                  <div className="mb-6 border-2 border-dashed border-slate-700 hover:border-indigo-500/50 bg-slate-950/50 rounded-xl p-6 text-center transition-all cursor-pointer relative">
                    <input 
                      type="file" 
                      onChange={handleFileUpload}
                      className="absolute inset-0 opacity-0 cursor-pointer"
                      accept="image/*,application/pdf"
                    />
                    <i data-lucide="upload" className="w-8 h-8 text-slate-400 mx-auto mb-2"></i>
                    {ocrScanning ? (
                      <p className="text-sm text-indigo-400 animate-pulse font-medium">Menganalisis Struk via AI OCR...</p>
                    ) : (
                      <>
                        <p className="text-sm font-medium text-slate-300">Drop bukti kwitansi / invoice di sini</p>
                        <p className="text-xs text-slate-500 mt-1">Ekstraksi Nominal & Vendor Otomatis</p>
                      </>
                    )}
                  </div>

                  <form onSubmit={handleSubmitTransaction} className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Nominal (IDR)</label>
                        <input 
                          type="number" 
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          placeholder="0"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Nama Vendor / Penerima</label>
                        <input 
                          type="text" 
                          value={vendor}
                          onChange={(e) => setVendor(e.target.value)}
                          placeholder="Contoh: PT Telkom Indonesia"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                          required
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Deskripsi Transaksi</label>
                      <textarea 
                        rows="3"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        placeholder="Detail pengeluaran..."
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        required
                      ></textarea>
                    </div>

                    <button 
                      type="submit" 
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition-all"
                    >
                      Simpan Transaksi & Kirim ke System
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-5 space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i data-lucide="shield-alert" className="w-4 h-4 text-indigo-400"></i> Real-time Fraud Detector
                      </h3>
                      <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${
                        riskScore > 50 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 
                        riskScore > 20 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 
                        'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                      }`}>
                        Risk Level: {riskScore}%
                      </span>
                    </div>

                    <div className="space-y-3">
                      {riskFlags.length > 0 ? (
                        riskFlags.map((flag, idx) => (
                          <div key={idx} className="flex items-start gap-2 bg-red-950/30 border border-red-900/50 p-3 rounded-lg text-xs text-red-300">
                            <i data-lucide="alert-triangle" className="w-4 h-4 text-red-400 shrink-0 mt-0.5"></i>
                            <span>{flag}</span>
                          </div>
                        ))
                      ) : (
                        <div className="flex items-center gap-2 bg-emerald-950/30 border border-emerald-900/50 p-3 rounded-lg text-xs text-emerald-300">
                          <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                          <span>Transaksi normal. Tidak terdeteksi indikasi anomali.</span>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h3 className="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
                      <i data-lucide="clock" className="w-4 h-4 text-indigo-400"></i> Automatic Approval Routing
                    </h3>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div className="text-xs text-slate-400 mb-1">Status Jalur Persetujuan:</div>
                      <div className="text-sm font-bold text-white flex items-center gap-2">
                        <span className="h-2 w-2 rounded-full bg-indigo-500"></span>
                        {approvalStatus}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                <div>
                  <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                    <i data-lucide="calculator" className="w-5 h-5 text-indigo-400"></i> Predictive Cash Flow Simulator (Stresstest 30 Hari)
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">Simulasikan dampak keterlambatan pembayaran klien terhadap saldo kas Anda.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Saldo Kas Sekarang</span>
                    <div className="text-xl font-bold text-emerald-400 mt-1">Rp 500.000.000</div>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Simulasi Keterlambatan Pembayaran</span>
                    <div className="flex items-center gap-2 mt-2">
                      <input 
                        type="range" 
                        min="0" 
                        max="60" 
                        value={delayDays}
                        onChange={(e) => {
                          setDelayDays(e.target.value);
                          setProjectedBalance(500000000 - (e.target.value * 3500000));
                        }}
                        className="w-full accent-indigo-500 cursor-pointer"
                      />
                      <span className="text-xs font-bold text-indigo-400 w-16">{delayDays} Hari</span>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Proyeksi Saldo (30 Hari ke Depan)</span>
                    <div className={`text-xl font-bold mt-1 ${projectedBalance < 400000000 ? 'text-amber-400' : 'text-indigo-400'}`}>
                      Rp {projectedBalance.toLocaleString('id-ID')}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FinancialApp />);
  </script>
</body>
</html>
