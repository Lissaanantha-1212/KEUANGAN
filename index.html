<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCore OS Enterprise</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdvancedFinancialApp() {
      const [currentMenu, setCurrentMenu] = useState('dashboard');
      const [amount, setAmount] = useState('');
      const [vendor, setVendor] = useState('');
      const [category, setCategory] = useState('Operational Expense (OPEX)');
      const [department, setDepartment] = useState('Marketing & Growth');
      const [taxType, setTaxType] = useState('PPN_11');
      const [description, setDescription] = useState('');
      const [paymentTerms, setPaymentTerms] = useState('Net 30 Hari');

      const [riskScore, setRiskScore] = useState(0);
      const [riskFlags, setRiskFlags] = useState([]);
      const [approvalPath, setApprovalPath] = useState('Direct Manager Approval');

      useEffect(() => {
        lucide.createIcons();
      }, [currentMenu, riskScore]);

      useEffect(() => {
        let score = 0;
        let flags = [];
        const num = parseFloat(amount) || 0;

        if (num > 100000000) {
          score += 50;
          flags.push('Transaksi > Rp100 Juta memerlukan Wewenang Direksi & Audit Board');
          setApprovalPath('Board of Directors Approval');
        } else if (num > 20000000) {
          score += 20;
          setApprovalPath('Finance Controller Approval');
        } else {
          setApprovalPath('Department Head Auto-Routing');
        }

        if (taxType === 'NONE' && num > 5000000) {
          score += 25;
          flags.push('Potensi Pajak (PPN/PPh) tidak terdeteksi pada transaksi > Rp5 Juta');
        }

        if (description.toLowerCase().includes('cash') || description.toLowerCase().includes('darurat')) {
          score += 30;
          flags.push('Transaksi tunai/tanpa invoice resmi terdeteksi audit flag');
        }

        setRiskScore(score);
        setRiskFlags(flags);
      }, [amount, taxType, description]);

      return (
        <div className="flex h-screen overflow-hidden">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div>
              <div className="p-5 border-b border-slate-800 flex items-center gap-3">
                <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30">
                  F
                </div>
                <div>
                  <h1 className="font-bold text-base text-white tracking-tight flex items-center gap-1.5">
                    FinCore OS <span className="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-1.5 py-0.2 rounded font-semibold">v3.4</span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Enterprise Edition</p>
                </div>
              </div>

              <nav className="p-3 space-y-1 text-xs font-medium">
                <button 
                  onClick={() => setCurrentMenu('dashboard')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all ${currentMenu === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Executive Dashboard
                </button>

                <button 
                  onClick={() => setCurrentMenu('input')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all ${currentMenu === 'input' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="receipt" className="w-4 h-4"></i> Smart Entry & Audit Guard
                </button>

                <button 
                  onClick={() => setCurrentMenu('tax')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all ${currentMenu === 'tax' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="percent" className="w-4 h-4"></i> Real-time Tax Radar
                </button>

                <button 
                  onClick={() => setCurrentMenu('multientity')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all ${currentMenu === 'multientity' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="building-2" className="w-4 h-4"></i> Inter-Company & Branches
                </button>

                <button 
                  onClick={() => setCurrentMenu('assets')} 
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all ${currentMenu === 'assets' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="box" className="w-4 h-4"></i> Asset Depreciation Intelligence
                </button>
              </nav>
            </div>

            <div className="p-3 border-t border-slate-800">
              <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <div className="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Entitas Aktif</div>
                  <div className="text-xs font-semibold text-slate-200">PT Nusantara Holding</div>
                </div>
                <i data-lucide="chevrons-up-down" className="w-4 h-4 text-slate-400"></i>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 overflow-y-auto bg-slate-950 p-8">
            
            {/* VIEW 1: EXECUTIVE DASHBOARD */}
            {currentMenu === 'dashboard' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white">Executive Control Tower</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Visibilitas arus kas, runway perusahaan, dan proyeksi beban pajak secara real-time.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs">
                      <span>Total Liquid Cash</span>
                      <i data-lucide="wallet" className="w-4 h-4 text-emerald-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-white mt-2">Rp 1.480.000.000</div>
                    <span className="text-[11px] text-emerald-400 flex items-center gap-1 mt-2">
                      <i data-lucide="trending-up" className="w-3 h-3"></i> +12% dibanding bulan lalu
                    </span>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs">
                      <span>Cash Runway (Est. Survival)</span>
                      <i data-lucide="flame" className="w-4 h-4 text-amber-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-amber-400 mt-2">14 Bulan 12 Hari</div>
                    <span className="text-[11px] text-slate-400 mt-2 block">Burn rate: Rp105 Juta/Bulan</span>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs">
                      <span>Est. Real-time Tax Liability</span>
                      <i data-lucide="scale" className="w-4 h-4 text-indigo-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-white mt-2">Rp 84.200.000</div>
                    <span className="text-[11px] text-indigo-400 mt-2 block">Akrual PPN & PPh21/23 Aktif</span>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs">
                      <span>Fraud & Leak Alerts</span>
                      <i data-lucide="shield-alert" className="w-4 h-4 text-red-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-red-400 mt-2">2 Unresolved</div>
                    <span className="text-[11px] text-red-400 mt-2 block font-medium">Butuh Tindakan Segera</span>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="git-pull-request" className="w-4 h-4 text-indigo-400"></i> Matriks Saldo Antar Cabang / Anak Perusahaan (Inter-Company Settlement)
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div className="text-slate-400">Cabang Jakarta ➔ Holding</div>
                      <div className="text-base font-bold text-emerald-400 mt-1">Hutang Rp45.000.000</div>
                      <span className="text-[10px] text-slate-500">Otomatis Tereliminasi di Laporan Konsolidasi</span>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div className="text-slate-400">Cabang Surabaya ➔ Holding</div>
                      <div className="text-base font-bold text-indigo-400 mt-1">Piutang Rp12.500.000</div>
                      <span className="text-[10px] text-slate-500">Jatuh Tempo: 28 Agu 2026</span>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div className="text-slate-400">Cabang Bali ➔ Cabang Jakarta</div>
                      <div className="text-base font-bold text-slate-300 mt-1">Lunas (Rp 0)</div>
                      <span className="text-[10px] text-emerald-500 font-medium">Settlement Berhasil</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: SMART TRANSACTION INPUT */}
            {currentMenu === 'input' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                  <div className="border-b border-slate-800 pb-4 mb-6 flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-bold text-white">Smart Transaction Engine</h2>
                      <p className="text-xs text-slate-400">Input dengan alokasi Cost Center, Pajak, dan Deteksi Kebocoran Otomatis.</p>
                    </div>
                    <span className="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-mono">OCR Engine Ready</span>
                  </div>

                  <form className="space-y-4 text-xs">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Nominal Transaksi (IDR)</label>
                        <input 
                          type="number" 
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          placeholder="0"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono"
                        />
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Nama Vendor / Third Party</label>
                        <input 
                          type="text" 
                          value={vendor}
                          onChange={(e) => setVendor(e.target.value)}
                          placeholder="PT Supplier Utama"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Payment Terms</label>
                        <select 
                          value={paymentTerms}
                          onChange={(e) => setPaymentTerms(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Cash / Immediate</option>
                          <option>Net 15 Hari</option>
                          <option>Net 30 Hari</option>
                          <option>2/10 Net 30 (Diskon Cepat 2%)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Cost Center / Departemen</label>
                        <select 
                          value={department}
                          onChange={(e) => setDepartment(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Marketing & Growth</option>
                          <option>IT & Infrastructure</option>
                          <option>Human Resources</option>
                          <option>Operations & Supply Chain</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Kategori Akun (COA)</label>
                        <select 
                          value={category}
                          onChange={(e) => setCategory(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Operational Expense (OPEX)</option>
                          <option>Capital Expense (CAPEX)</option>
                          <option>Prepaid Expense (Biaya Dibayar di Muka)</option>
                          <option>Direct Cost (COGS)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Perlakuan Pajak</label>
                        <select 
                          value={taxType}
                          onChange={(e) => setTaxType(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option value="PPN_11">PPN 11% (Masukan)</option>
                          <option value="PPH_23">PPh Pasal 23 (Potong 2%)</option>
                          <option value="PPH_21">PPh Pasal 21 (Tenaga Ahli)</option>
                          <option value="NONE">Tanpa Pemotongan Pajak</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block font-medium text-slate-400 mb-1">Deskripsi & Catatan Audit</label>
                      <textarea 
                        rows="3"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        placeholder="Rincian lengkap pengeluaran dan tujuan bisnis..."
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                      ></textarea>
                    </div>

                    <button 
                      type="button" 
                      onClick={() => alert('Transaksi Berhasil Terverifikasi oleh System Guard')}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2"
                    >
                      <i data-lucide="shield-check" className="w-4 h-4"></i> Submit Transaksi & Jalankan Audit Automated
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-4 space-y-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <div className="flex justify-between items-center mb-3">
                      <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="shield" className="w-4 h-4 text-indigo-400"></i> Fraud & Risk Monitor
                      </h3>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                        riskScore > 40 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                      }`}>
                        Score: {riskScore}%
                      </span>
                    </div>

                    <div className="space-y-2 text-xs">
                      {riskFlags.length > 0 ? (
                        riskFlags.map((flag, idx) => (
                          <div key={idx} className="p-2.5 bg-red-950/30 border border-red-900/50 rounded-lg text-red-300 flex items-start gap-2 text-[11px]">
                            <i data-lucide="alert-triangle" className="w-4 h-4 text-red-400 shrink-0"></i>
                            <span>{flag}</span>
                          </div>
                        ))
                      ) : (
                        <div className="p-2.5 bg-emerald-950/30 border border-emerald-900/50 rounded-lg text-emerald-300 flex items-center gap-2 text-[11px]">
                          <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                          <span>Transaksi bersih dari indikasi kejanggalan.</span>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-xs">
                    <h3 className="font-bold text-white mb-2 flex items-center gap-2">
                      <i data-lucide="git-commit" className="w-4 h-4 text-indigo-400"></i> Smart Approval Matrix
                    </h3>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                      <div className="text-[10px] text-slate-500">Routing Jalur Persetujuan:</div>
                      <div className="font-semibold text-indigo-400">{approvalPath}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: REAL-TIME TAX RADAR */}
            {currentMenu === 'tax' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white">Real-time Tax Radar</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Pantau akrual kewajiban pajak PPN & PPh secara otomatis tanpa perlu menunggu laporan akuntan akhir bulan.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="text-slate-400 text-xs">PPN Masukan (Dapat Dikreditkan)</div>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">Rp 48.500.000</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="text-slate-400 text-xs">PPN Keluaran (Terutang)</div>
                    <div className="text-2xl font-bold text-red-400 mt-1">Rp 112.000.000</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <div className="text-slate-400 text-xs">Kurang Bayar PPN Neto</div>
                    <div className="text-2xl font-bold text-amber-400 mt-1">Rp 63.500.000</div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="file-spreadsheet" className="w-4 h-4 text-indigo-400"></i> Rincian Akrual Potongan Pajak PPh (PPh 21 / 23 / 4(2))
                  </h3>
                  <div className="overflow-x-auto text-xs">
                    <table className="w-full text-left">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] border-b border-slate-800">
                        <tr>
                          <th className="p-3">Jenis Pajak</th>
                          <th className="p-3">Objek Pajak</th>
                          <th className="p-3">DPP (Nominal Dasar)</th>
                          <th className="p-3">Tarif</th>
                          <th className="p-3">Estimasi Pajak Terutang</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 text-slate-200">
                        <tr>
                          <td className="p-3 font-semibold text-indigo-400">PPh Pasal 23</td>
                          <td className="p-3">Jasa Maintenance IT Server</td>
                          <td className="p-3">Rp 25.000.000</td>
                          <td className="p-3">2%</td>
                          <td className="p-3 text-emerald-400">Rp 500.000</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-semibold text-indigo-400">PPh Pasal 21</td>
                          <td className="p-3">Gaji & Remunerasi Karyawan</td>
                          <td className="p-3">Rp 180.000.000</td>
                          <td className="p-3">Progressive</td>
                          <td className="p-3 text-emerald-400">Rp 14.200.000</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-semibold text-indigo-400">PPh Pasal 4(2)</td>
                          <td className="p-3">Sewa Gedung Kantor Jakarta</td>
                          <td className="p-3">Rp 60.000.000</td>
                          <td className="p-3">10%</td>
                          <td className="p-3 text-emerald-400">Rp 6.000.000</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 4: INTER-COMPANY & BRANCHES */}
            {currentMenu === 'multientity' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white">Inter-Company & Multi-Branch Hub</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Kelola konsolidasi arus kas antar anak perusahaan, cabang, dan jurnal eliminasi otomatis.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-white text-sm">Cabang Jakarta</h3>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded">Active</span>
                    </div>
                    <div className="text-xs text-slate-400">Kas Operasional: <span className="text-white font-mono font-bold">Rp 620.000.000</span></div>
                    <div className="text-xs text-slate-400">Hutang ke Holding: <span className="text-amber-400 font-mono font-bold">Rp 45.000.000</span></div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-white text-sm">Cabang Surabaya</h3>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded">Active</span>
                    </div>
                    <div className="text-xs text-slate-400">Kas Operasional: <span className="text-white font-mono font-bold">Rp 410.000.000</span></div>
