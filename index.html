<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCore OS v3.4 Enterprise - Full Live System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // === KREDENSIAL SUPABASE LANGSUNG KONEK ===
    const SUPABASE_URL = "https://ztgjmyjrtrlyrgntvtny.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GGh8txjx_3OFYwmTGdccjQ_zkxRYqep";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function FinCoreEnterpriseOS() {
      const [currentMenu, setCurrentMenu] = useState('dashboard');
      const [loading, setLoading] = useState(false);
      
      // Real Data States dari Supabase
      const [transactions, setTransactions] = useState([]);
      const [assets, setAssets] = useState([]);
      const [intercompany, setIntercompany] = useState([]);

      // Smart Entry Form States
      const [amount, setAmount] = useState('');
      const [vendor, setVendor] = useState('');
      const [category, setCategory] = useState('Operational Expense (OPEX)');
      const [department, setDepartment] = useState('Marketing & Growth');
      const [taxType, setTaxType] = useState('PPN_11');
      const [description, setDescription] = useState('');
      const [paymentTerms, setPaymentTerms] = useState('Net 30 Hari');

      // Risk & Audit Engine States
      const [riskScore, setRiskScore] = useState(0);
      const [riskFlags, setRiskFlags] = useState([]);
      const [approvalPath, setApprovalPath] = useState('Department Head Auto-Routing');

      useEffect(() => {
        loadAllSupabaseData();
      }, []);

      useEffect(() => {
        lucide.createIcons();
      }, [currentMenu, riskScore, transactions, assets, intercompany]);

      // Ambil Seluruh Data secara Real-Time dari Supabase
      const loadAllSupabaseData = async () => {
        try {
          const { data: transData } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });
          const { data: assetData } = await supabase.from('assets').select('*').order('created_at', { ascending: false });
          const { data: icData } = await supabase.from('intercompany_transfers').select('*').order('created_at', { ascending: false });

          setTransactions(transData || []);
          setAssets(assetData || []);
          setIntercompany(icData || []);
        } catch (err) {
          console.error('Error Sync Supabase:', err);
        }
      };

      // Real-time Audit & Risk Guard Engine
      useEffect(() => {
        let score = 0;
        let flags = [];
        const num = parseFloat(amount) || 0;

        if (num > 100000000) {
          score += 45;
          flags.push('Beban pengeluaran > Rp 100 Juta wajib Approval Direksi');
          setApprovalPath('Board of Directors Approval');
        } else if (num > 25000000) {
          score += 20;
          setApprovalPath('Finance Controller Approval');
        } else {
          setApprovalPath('Department Head Auto-Routing');
        }

        if (taxType === 'NONE' && num > 5000000) {
          score += 30;
          flags.push('Peringatan: Transaksi > Rp 5 Juta tanpa PPN/PPh terdeteksi rintangan tax audit');
        }

        const descLower = description.toLowerCase();
        if (descLower.includes('cash') || descLower.includes('darurat') || descLower.includes('pinjam') || descLower.includes('tanpa nota')) {
          score += 35;
          flags.push('Keyword Berbahaya Terdeteksi: Potensi Kebocoran Kas (Fraud Risk)');
        }

        setRiskScore(score);
        setRiskFlags(flags);
      }, [amount, taxType, description]);

      // Submit Form & Sync ke Supabase
      const handleTransactionSubmit = async (e) => {
        e.preventDefault();
        if (!amount || !vendor) {
          alert('Mohon lengkapi nominal dan nama vendor!');
          return;
        }

        setLoading(true);
        const payload = {
          amount: parseFloat(amount),
          vendor_name: vendor,
          payment_terms: paymentTerms,
          department: department,
          category: category,
          tax_type: taxType,
          description: description,
          risk_score: riskScore,
          approval_path: approvalPath,
          status: riskScore > 40 ? 'Pending Approval' : 'Approved'
        };

        const { error } = await supabase.from('transactions').insert([payload]);
        setLoading(false);

        if (error) {
          alert('Gagal simpan ke Supabase: ' + error.message);
        } else {
          alert('Transaksi berhasil di-audit dan tersimpan di database Supabase!');
          setAmount('');
          setVendor('');
          setDescription('');
          loadAllSupabaseData();
        }
      };

      // Real Financial Aggregations
      const totalExpense = transactions.reduce((acc, t) => acc + (t.amount || 0), 0);
      const initialCapital = 1480000000; // Capital baseline
      const currentLiquidCash = initialCapital - totalExpense;
      const totalTaxLiability = transactions.reduce((acc, t) => {
        if (t.tax_type === 'PPN_11') return acc + (t.amount * 0.11);
        if (t.tax_type === 'PPH_23') return acc + (t.amount * 0.02);
        if (t.tax_type === 'PPH_21') return acc + (t.amount * 0.05);
        return acc;
      }, 84200000);

      const unresolvedFrauds = transactions.filter(t => t.risk_score > 40).length;

      return (
        <div className="flex h-screen overflow-hidden bg-slate-950">
          
          {/* SIDEBAR COMPONENT */}
          <aside className="w-64 bg-slate-900/90 border-r border-slate-800/80 flex flex-col justify-between shrink-0">
            <div>
              <div className="p-5 border-b border-slate-800/80 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-indigo-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30">
                    F
                  </div>
                  <div>
                    <h1 className="font-bold text-sm text-white tracking-tight flex items-center gap-1.5">
                      FinCore OS <span className="text-[9px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-1 py-0.2 rounded font-mono">v3.4</span>
                    </h1>
                    <p className="text-[10px] text-slate-400">Enterprise Edition</p>
                  </div>
                </div>
              </div>

              <nav className="p-3 space-y-1.5 text-xs font-medium">
                <button 
                  onClick={() => setCurrentMenu('dashboard')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all ${currentMenu === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Executive Dashboard
                </button>

                <button 
                  onClick={() => setCurrentMenu('input')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all ${currentMenu === 'input' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="shield-check" className="w-4 h-4"></i> Smart Entry & Audit Guard
                </button>

                <button 
                  onClick={() => setCurrentMenu('tax')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all ${currentMenu === 'tax' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="percent" className="w-4 h-4"></i> Real-time Tax Radar
                </button>

                <button 
                  onClick={() => setCurrentMenu('intercompany')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all ${currentMenu === 'intercompany' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="git-fork" className="w-4 h-4"></i> Inter-Company & Branches
                </button>

                <button 
                  onClick={() => setCurrentMenu('assets')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all ${currentMenu === 'assets' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <i data-lucide="box" className="w-4 h-4"></i> Asset Depreciation Intel
                </button>
              </nav>
            </div>

            <div className="p-3 border-t border-slate-800/80">
              <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
                <div>
                  <div className="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Active Database</div>
                  <div className="text-xs font-semibold text-emerald-400 flex items-center gap-1.5 mt-0.5">
                    <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Supabase Connected
                  </div>
                </div>
              </div>
            </div>
          </aside>

          {/* MAIN DISPLAY ENGINE */}
          <main className="flex-1 overflow-y-auto bg-slate-950 p-8">
            
            {/* MENU 1: EXECUTIVE DASHBOARD */}
            {currentMenu === 'dashboard' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white tracking-tight">Executive Control Tower</h2>
                  <p className="text-xs text-slate-400 mt-1">Visibilitas arus kas, runway perusahaan, dan proyeksi beban pajak secara real-time.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl relative overflow-hidden">
                    <div className="flex justify-between items-start text-slate-400 text-xs font-medium">
                      <span>Total Liquid Cash</span>
                      <i data-lucide="wallet" className="w-4 h-4 text-emerald-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-white mt-3 font-mono">
                      Rp {currentLiquidCash.toLocaleString('id-ID')}
                    </div>
                    <span className="text-[11px] text-emerald-400 mt-2 flex items-center gap-1">
                      <i data-lucide="trending-up" className="w-3 h-3"></i> Real-time DB Balance
                    </span>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs font-medium">
                      <span>Cash Runway (Est. Survival)</span>
                      <i data-lucide="flame" className="w-4 h-4 text-amber-500"></i>
                    </div>
                    <div className="text-2xl font-bold text-amber-400 mt-3 font-mono">
                      14 Bulan 12 Hari
                    </div>
                    <span className="text-[11px] text-slate-400 mt-2 block">Burn rate: Rp105 Juta/Bulan</span>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs font-medium">
                      <span>Est. Real-time Tax Liability</span>
                      <i data-lucide="scale" className="w-4 h-4 text-indigo-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-indigo-300 mt-3 font-mono">
                      Rp {totalTaxLiability.toLocaleString('id-ID')}
                    </div>
                    <span className="text-[11px] text-indigo-400 mt-2 block">Akrual PPN & PPh21/23 Aktif</span>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <div className="flex justify-between items-start text-slate-400 text-xs font-medium">
                      <span>Fraud & Leak Alerts</span>
                      <i data-lucide="alert-octagon" className="w-4 h-4 text-red-400"></i>
                    </div>
                    <div className="text-2xl font-bold text-red-400 mt-3">
                      {unresolvedFrauds} Unresolved
                    </div>
                    <span className="text-[11px] text-red-400 mt-2 block font-medium">Butuh Tindakan Segera</span>
                  </div>
                </div>

                {/* Live Transactions Table */}
                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6">
                  <h3 className="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="database" className="w-4 h-4 text-indigo-400"></i> Live Database Audit Stream (Supabase)
                  </h3>
                  <div className="overflow-x-auto text-xs">
                    <table className="w-full text-left">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] border-b border-slate-800">
                        <tr>
                          <th className="p-3">Vendor / Pihak Ke-3</th>
                          <th className="p-3">Nominal Transaksi</th>
                          <th className="p-3">Cost Center</th>
                          <th className="p-3">Risk Score</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 text-slate-200">
                        {transactions.length > 0 ? (
                          transactions.map((t) => (
                            <tr key={t.id} className="hover:bg-slate-800/30">
                              <td className="p-3 font-semibold text-white">{t.vendor_name}</td>
                              <td className="p-3 font-mono text-emerald-400 font-bold">Rp {t.amount?.toLocaleString('id-ID')}</td>
                              <td className="p-3 text-slate-400">{t.department}</td>
                              <td className="p-3">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.risk_score > 40 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                                  {t.risk_score}% Risk
                                </span>
                              </td>
                              <td className="p-3 text-slate-300">{t.status}</td>
                            </tr>
                          ))
                        ) : (
                          <tr>
                            <td colSpan="5" className="p-6 text-center text-slate-500">Belum ada data transaksi tersimpan di Supabase. Gunakan menu Smart Entry untuk menginput.</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* MENU 2: SMART ENTRY FORM */}
            {currentMenu === 'input' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-8 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-2xl">
                  <div className="border-b border-slate-800/80 pb-4 mb-6">
                    <h2 className="text-base font-bold text-white">Smart Transaction Engine</h2>
                    <p className="text-xs text-slate-400 mt-0.5">Input transaksi langsung tersimpan secara terintegrasi ke Supabase.</p>
                  </div>

                  <form onSubmit={handleTransactionSubmit} className="space-y-4 text-xs">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Nominal Transaksi (IDR)</label>
                        <input 
                          type="number" 
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          placeholder="0"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono"
                        />
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Nama Vendor / Third Party</label>
                        <input 
                          type="text" 
                          value={vendor}
                          onChange={(e) => setVendor(e.target.value)}
                          placeholder="PT Supplier Utama"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Payment Terms</label>
                        <select 
                          value={paymentTerms}
                          onChange={(e) => setPaymentTerms(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Cash / Immediate</option>
                          <option>Net 15 Hari</option>
                          <option>Net 30 Hari</option>
                          <option>2/10 Net 30 (Diskon 2%)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Cost Center / Departemen</label>
                        <select 
                          value={department}
                          onChange={(e) => setDepartment(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Marketing & Growth</option>
                          <option>IT & Infrastructure</option>
                          <option>Human Resources</option>
                          <option>Operations & Supply Chain</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Kategori Akun (COA)</label>
                        <select 
                          value={category}
                          onChange={(e) => setCategory(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Operational Expense (OPEX)</option>
                          <option>Capital Expense (CAPEX)</option>
                          <option>Prepaid Expense</option>
                          <option>Direct Cost (COGS)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium text-slate-400 mb-1">Perlakuan Pajak</label>
                        <select 
                          value={taxType}
                          onChange={(e) => setTaxType(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option value="PPN_11">PPN 11% (Masukan)</option>
                          <option value="PPH_23">PPh Pasal 23 (Potong 2%)</option>
                          <option value="PPH_21">PPh Pasal 21 (Tenaga Ahli)</option>
                          <option value="NONE">Tanpa Pemotongan Pajak</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block font-medium text-slate-400 mb-1">Deskripsi & Catatan Audit</label>
                      <textarea 
                        rows="3"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        placeholder="Rincian lengkap pengeluaran dan tujuan bisnis..."
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                      ></textarea>
                    </div>

                    <button 
                      type="submit" 
                      disabled={loading}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2"
                    >
                      {loading ? 'Menyimpan ke Supabase...' : 'Submit Transaksi & Simpan ke Supabase'}
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-4 space-y-4">
                  <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5">
                    <div className="flex justify-between items-center mb-3">
                      <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="shield" className="w-4 h-4 text-indigo-400"></i> Fraud & Risk Monitor
                      </h3>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                        riskScore > 40 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                      }`}>
                        Score: {riskScore}%
                      </span>
                    </div>

                    <div className="space-y-2 text-xs">
                      {riskFlags.length > 0 ? (
                        riskFlags.map((flag, idx) => (
                          <div key={idx} className="p-2.5 bg-red-950/30 border border-red-900/50 rounded-lg text-red-300 flex items-start gap-2 text-[11px]">
                            <i data-lucide="alert-triangle" className="w-4 h-4 text-red-400 shrink-0"></i>
                            <span>{flag}</span>
                          </div>
                        ))
                      ) : (
                        <div className="p-2.5 bg-emerald-950/30 border border-emerald-900/50 rounded-lg text-emerald-300 flex items-center gap-2 text-[11px]">
                          <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                          <span>Transaksi bersih dari indikasi kejanggalan.</span>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 text-xs">
                    <h3 className="font-bold text-white mb-2 flex items-center gap-2">
                      <i data-lucide="git-commit" className="w-4 h-4 text-indigo-400"></i> Smart Approval Matrix
                    </h3>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                      <div className="text-[10px] text-slate-500">Routing Jalur Persetujuan:</div>
                      <div className="font-semibold text-indigo-400">{approvalPath}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MENU 3: REAL-TIME TAX RADAR */}
            {currentMenu === 'tax' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white">Real-time Tax Radar</h2>
                  <p className="text-xs text-slate-400">Perhitungan otomatis potensi PPN & PPh terintegrasi langsung dari transaksi DB.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <span className="text-xs text-slate-400">Total Akrual PPN Masukan (11%)</span>
                    <div className="text-xl font-bold text-indigo-400 mt-2 font-mono">
                      Rp {(transactions.filter(t => t.tax_type === 'PPN_11').reduce((a, b) => a + (b.amount * 0.11), 0)).toLocaleString('id-ID')}
                    </div>
                  </div>
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <span className="text-xs text-slate-400">Potongan PPh 23 (Jasa - 2%)</span>
                    <div className="text-xl font-bold text-emerald-400 mt-2 font-mono">
                      Rp {(transactions.filter(t => t.tax_type === 'PPH_23').reduce((a, b) => a + (b.amount * 0.02), 0)).toLocaleString('id-ID')}
                    </div>
                  </div>
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <span className="text-xs text-slate-400">Potongan PPh 21 (Tenaga Ahli - 5%)</span>
                    <div className="text-xl font-bold text-amber-400 mt-2 font-mono">
                      Rp {(transactions.filter(t => t.tax_type === 'PPH_21').reduce((a, b) => a + (b.amount * 0.05), 0)).toLocaleString('id-ID')}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MENU 4: INTER-COMPANY & BRANCHES */}
            {currentMenu === 'intercompany' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white">Inter-Company & Branch Settlement</h2>
                  <p className="text-xs text-slate-400">Matriks saldo dan konsolidasi transaksi antar-cabang holding.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <div className="text-xs text-slate-400 font-medium">Cabang Jakarta → Holding</div>
                    <div className="text-lg font-bold text-red-400 mt-2">Hutang Rp 45.000.000</div>
                    <span className="text-[10px] text-slate-500 mt-1 block">Otomatis Tereliminasi di Konsolidasi</span>
                  </div>
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <div className="text-xs text-slate-400 font-medium">Cabang Surabaya → Holding</div>
                    <div className="text-lg font-bold text-emerald-400 mt-2">Piutang Rp 12.500.000</div>
                    <span className="text-[10px] text-slate-500 mt-1 block">Jatuh Tempo: 28 Agu 2026</span>
                  </div>
                  <div className="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
                    <div className="text-xs text-slate-400 font-medium">Cabang Bali → Cabang Jakarta</div>
                    <div className="text-lg font-bold text-slate-400 mt-2">Lunas (Rp 0)</div>
                    <span className="text-[10px] text-emerald-400 mt-1 block">Settlement Berhasil</span>
                  </div>
                </div>
              </div>
            )}

            {/* MENU 5: ASSET DEPRECIATION INTELLIGENCE */}
            {currentMenu === 'assets' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white">Asset Depreciation Intelligence</h2>
                  <p className="text-xs text-slate-400">Pencatatan aset perusahaan dan perhitungan penyusutan otomatis.</p>
                </div>

                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 text-xs">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] border-b border-slate-800">
                        <tr>
                          <th className="p-3">Nama Aset</th>
                          <th className="p-3">Harga Beli</th>
                          <th className="p-3">Masa Manfaat</th>
                          <th className="p-3">Akumulasi Penyusutan</th>
                          <th className="p-3">Nilai Buku Saat Ini</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 text-slate-200">
                        <tr>
                          <td className="p-3 font-semibold text-white">MacBook Pro M3 Max (5 Unit)</td>
                          <td className="p-3 font-mono">Rp 225.000.000</td>
                          <td className="p-3">4 Tahun</td>
                          <td className="p-3 font-mono text-amber-400">Rp 46.875.000</td>
                          <td className="p-3 font-mono text-emerald-400 font-bold">Rp 178.125.000</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-semibold text-white">Mobil Operasional Avanza</td>
                          <td className="p-3 font-mono">Rp 260.000.000</td>
                          <td className="p-3">8 Tahun</td>
                          <td className="p-3 font-mono text-amber-400">Rp 65.000.000</td>
                          <td className="p-3 font-mono text-emerald-400 font-bold">Rp 195.000.000</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FinCoreEnterpriseOS />);
  </script>
</body>
